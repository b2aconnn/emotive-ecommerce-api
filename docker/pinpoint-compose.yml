version: '3'
services:
  zoo1:
    image: zookeeper:3.5
    container_name: zoo1
    hostname: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
    networks:
      default:
        aliases:
          - zoo2
          - zoo3
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pinpoint-hbase:
    image: pinpointdocker/pinpoint-hbase:2.5.4
    container_name: pinpoint-hbase
    depends_on:
      zoo1:
        condition: service_healthy
    ports:
      - "16000:16000"
      - "16010:16010"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/16010"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  pinpoint-collector:
    image: pinpointdocker/pinpoint-collector:2.5.4
    container_name: pinpoint-collector
    depends_on:
      pinpoint-hbase:
        condition: service_healthy
    ports:
      - "9991:9991"
      - "9992:9992"
      - "9993:9993"
      - "9994:9994/udp"
    environment:
      - PINPOINT_ZOOKEEPER_ADDRESS=zoo1
      - CLUSTER_ENABLE=false

  pinpoint-web:
    image: pinpointdocker/pinpoint-web:2.5.4
    container_name: pinpoint-web
    depends_on:
      - pinpoint-collector
    ports:
      - "8085:8080"
    environment:
      - PINPOINT_ZOOKEEPER_ADDRESS=zoo1
      - CLUSTER_ENABLE=false
      - SERVER_PORT=8080

networks:
  default:
    driver: bridge
